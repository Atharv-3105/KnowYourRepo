global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "knowyourrepo-go-api"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: "knowyourrepo-python-sidecar"
    static_configs:
      - targets: ["extraction-service:8000"]
    metrics_path: /metrics
