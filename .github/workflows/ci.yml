name:  CI

on:
  push: 
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: true 

#Least-Privilege
permissions:
  contents: read 

jobs:
  api:
    name: Go API 
    runs-on: ubuntu-latest
    defaults:
        run:
          working-directory: api 

    #A temp PG+PgVector next to the Job, 
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowyourrepo
        ports:
          - 5432:5432 
        options: >-
            --health-cmd "pg_isready -U postgres -d knowyourrepo"
            --health-interval 5s 
            --health-timeout 5s
            --health-retries 10
    
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/knowyourrepo?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
        go-version-file: api/go.mod   #Single source of truth for the Go version
        cache-dependency-path: api/go.sum   #module cache keyed on go.sum 
          
      - name: Build 
        run: go build ./... 

      - name: Vet 
        run: go vet ./... 

      - name: Test 
        run: go test ./... -p 1 

  extraction-service:
    name: Python Extraction Service
    runs-on: ubuntu-latest
    defaults:
      run: 
          working-directory: extraction-service
     
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12"
          cache: pip 
          cache-dependency-path: extraction-service/requirements.txt
        
      - name: Install dependencies
        run: pip install -r requirements.txt 

      - name: Lint(ruff)
        run: ruff check .
      
      - name: Unit Tests(pytest)
        run: pytest -q 

      #A Smoke Test does the whole app wire together at import time
      - name: Import smoke test 
        run: python -c "import app.main; print('app imports ok')"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowyourrepo
