name:  CI

on:
  push: 
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: true 

#Least-Privilege
permissions:
  contents: read 

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: 
      contents: read 
      pull-requests: read
    outputs:
      api: ${{steps.f.outputs.api}}
      extraction-service: ${{steps.f.outputs.sidecar}}
      frontend: ${{steps.f.outputs.frontend}}
      
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f 
        with:
          filters: | 
           api:
              - 'api/**'
              - '.github/workflows/ci.yml'
           extraction-service:
              - 'extraction-service/**'
              - '.github/workflows/ci.yml'
           frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
  api:
    name: Go API 
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: 15
    defaults:
        run:
          working-directory: api 

    #A temp PG+PgVector next to the Job, 
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowyourrepo
        ports:
          - 5432:5432 
        options: >-
            --health-cmd "pg_isready -U postgres -d knowyourrepo"
            --health-interval 5s 
            --health-timeout 5s
            --health-retries 10
    
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/knowyourrepo?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod   #Single source of truth for the Go version
          cache-dependency-path: api/go.sum   #module cache keyed on go.sum 
          
      - name: Build 
        run: go build ./... 

      - name: Vet 
        run: go vet ./... 

      - name: Test 
        run: go test ./... -p 1 

  extraction-service:
    name: Python Extraction Service
    runs-on: ubuntu-latest
    needs: changes 
    if: needs.changes.outputs.extraction-service == 'true'
    timeout-minutes: 15
    defaults:
      run: 
          working-directory: extraction-service
     
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12"
          cache: pip 
          cache-dependency-path: extraction-service/requirements.txt
        
      - name: Install dependencies
        run: pip install -r requirements.txt 

      - name: Lint(ruff)
        run: ruff check .
      
      - name: Unit Tests(pytest)
        run: pytest -q 

      #A Smoke Test does the whole app wire together at import time
      - name: Import smoke test 
        run: python -c "import app.main; print('app imports ok')"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowyourrepo
          GROQ_API_KEY: ci-dummy-key
  
  frontend:
    name: frontend 
    runs-on: ubuntu-latest 
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 10 
    defaults:
        run:
            working-directory: frontend 
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 
          cache: npm 
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend 
        run: npm ci 
      
      - name: Lint (oxlint)
        run: npm run lint 

      - name: Type-check and build 
        run: npm run build 

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
           name: frontend-dist 
           path: frontend/dist 
           retention-days: 7
           if-no-files-found: error 

  ci-ok:
    name: CI passed
    needs: [api, extraction-service, frontend]
    if: always()   #Run even when a needed job failed or was skipped
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
         echo '${{toJSON(needs)}}'
         if [ "${{contains(needs.*.result, 'failure')}}" = "true"] || \
            [ "${{contains(needs.*.result, 'cancelled')}}" = "true"]; then 
           echo "A required job did not pass"; exit 1
          fi 

