services:

  postgres:
    image: pgvector/pgvector:pg16 
    container_name: knowyourrepo-postgres 
    environment:
      - POSTGRES_DB=knowyourrepo
      - POSTGRES_USER=postgres 
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data 
    # Bound to localhost only, on a non-default port (override with
    # POSTGRES_HOST_PORT) so it collides neither with a local Postgres on 5432
    # nor with other projects' databases, and isn't reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowyourrepo"]
      interval: 5s 
      timeout: 5s 
      retries: 10 
    restart: unless-stopped 
  
  extraction-service:
    build: 
      context: ./extraction-service
    container_name: knowyourrepo-extraction-service 
    env_file:
      - ./extraction-service/.env 
    environment:
      # Overrides whatever DATABASE_URL is in .env (that file was written
      # for `localhost`, which doesn't resolve inside the compose network).
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/knowyourrepo
      # Shared secret the api sends on every call (set SIDECAR_API_KEY in a
      # root .env file; empty disables the check).
      - INTERNAL_API_KEY=${SIDECAR_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on: 
      postgres: 
        condition: service_healthy 
    restart: unless-stopped 

  api:
    build: 
      context: ./api 
    container_name: knowyourrepo-api 
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/knowyourrepo?sslmode=disable
      - EXTRACTOR_URL=http://extraction-service:8000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - SIDECAR_API_KEY=${SIDECAR_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - LOG_FORMAT=json
    volumes:
      # Named volume: the container runs as a non-root user, which a host
      # bind mount's ownership wouldn't reliably allow. Clones are
      # disposable anyway - a missing clone is restored on demand.
      - repo-data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      extraction-service:
        condition: service_healthy
    restart: unless-stopped 

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time (Vite inlines import.meta.env.VITE_API_URL)
        # - must be the URL the *browser* can reach, i.e. the host-mapped
        # api port, not the api:8080 in-network address.
        VITE_API_URL: http://localhost:8080
    container_name: knowyourrepo-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: knowyourrepo-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: knowyourrepo-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  repo-data:
  prometheus-data:
  grafana-data:
