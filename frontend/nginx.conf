server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing - any unmatched path falls back to
    # index.html instead of nginx returning a 404 for e.g. /repos/abc/chat.
    location / {
        try_files $uri $uri/ /index.html;
    }
}